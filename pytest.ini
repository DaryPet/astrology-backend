[pytest]
markers =
    integration: hits the FastAPI app through TestClient/httpx (no real network)
    functional: multi-step scenario chaining several endpoints
    perf: performance/concurrency check, not run by default

# Perf tests are opt-in only (deselect by default so `pytest` stays fast/stable).
# test_event_regression.py is out of scope for this task and excluded from collection.
addopts = -m "not perf" --ignore=tests/test_event_regression.py
